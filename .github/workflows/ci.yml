name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements.lock"

      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y ffmpeg

      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      - name: Compile
        run: python -m compileall -q backend gui tests meeting_assistant.py start.py test_regex.py test_gemini.py scripts

      - name: Unit tests
        run: python scripts/run_ci_tests.py

      - name: Dependency consistency
        run: python -m pip check

  static-audits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements.lock"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.lock

      - name: Security scan
        run: python scripts/security_scan.py

      - name: Architecture guard
        run: python scripts/check_architecture.py

      - name: Frontend JavaScript syntax
        run: |
          node --check static/previous_minutes.js
          node --check static/previous_minutes_rerun.js

      - name: Quality consistency audit
        run: python scripts/audit_quality_consistency.py

      - name: Quality review backfill dry-run
        run: |
          python scripts/backfill_quality_review_segments.py > backfill.json
          python -c "import json; payload = json.load(open('backfill.json', encoding='utf-8')); assert payload['would_update'] == 0, payload"

      - name: Markdown quality note backfill dry-run
        run: |
          python scripts/backfill_markdown_quality_notes.py > markdown-backfill.json
          python -c "import json; payload = json.load(open('markdown-backfill.json', encoding='utf-8')); assert payload['would_update'] == 0, payload"

      - name: Unsafe segment cache prune dry-run
        run: |
          python scripts/prune_bad_segment_cache.py > segment-cache-prune.json
          python -c "import json; payload = json.load(open('segment-cache-prune.json', encoding='utf-8')); assert payload['would_delete'] == 0, payload"

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "requirements.lock"

      - name: Audit locked dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          python -m pip_audit -r requirements.lock
